<div class="page-header">

  <h2>Deployment Comparison</h2>

  <p>
    Compare system behavior before and after deployment.
  </p>

</div>


<section class="upload-grid">

  <div class="upload-card">

    <h3>Before Deployment</h3>

    <label class="file-picker">
      <span class="file-picker-action">Choose before log</span>
      <input class="visually-hidden-file" type="file" accept=".log,.txt" aria-label="Choose log before deployment" (change)="selectBefore($event)" />
    </label>

    @if (beforeFile) {
      <p class="selected-upload"><strong>{{ beforeFile.name }}</strong></p>
    }

  </div>


  <div class="upload-card">

    <h3>After Deployment</h3>

    <label class="file-picker">
      <span class="file-picker-action">Choose after log</span>
      <input class="visually-hidden-file" type="file" accept=".log,.txt" aria-label="Choose log after deployment" (change)="selectAfter($event)" />
    </label>

    @if (afterFile) {
      <p class="selected-upload"><strong>{{ afterFile.name }}</strong></p>
    }

  </div>

</section>


@if (error) {

  <div class="error" role="alert">
    {{ error }}
  </div>

}


<button
  type="button"
  class="compare-button"
  [attr.aria-busy]="loading"
  [disabled]="
    !beforeFile ||
    !afterFile ||
    loading
  "
  (click)="compare()">

  {{ loading
  ? 'Comparing...'
  : 'Compare Deployment'
  }}

</button>


@if (result) {

  <app-deployment-result
    [result]="result">
  </app-deployment-result>

}
