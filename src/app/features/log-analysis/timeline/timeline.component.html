<div class="page-header">

  <h2>Timeline Reconstruction</h2>

  <p>
    Chronological view of important log events.
  </p>

</div>


<section class="timeline">

  @for (
    trace of traces;
    track trace.traceId
    ) {

    <div class="timeline-item">

      <div class="timeline-time">
        {{ trace.startTime | date:'short' }}
      </div>

      <div class="timeline-dot"></div>

      <div class="timeline-content">
        <div class="trace-header">
           <strong>Trace ID: {{ trace.traceId }}</strong>
           <span class="duration">{{ trace.duration }}</span>
        </div>

        <div class="trace-events">
           @for (item of trace.events; track item.event.timestamp) {
             <div class="trace-event">
               <app-severity-badge [severity]="item.event.level"></app-severity-badge>
               <span>{{ item.event.message }}</span>
             </div>
           }
        </div>
      </div>

    </div>

  }

</section>
